ence: document section A</text><text x="30" y="424" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Document date: 01/01/2025</text><text x="30" y="460" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Reviewer checks: identity, source, required fields</text><text x="30" y="496" fill="#35333B" font-family="Arial" font-size="19" font-weight="400" /><text x="30" y="532" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">This example contains no original patient record.</text><text x="30" y="568" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Clinical content is illustrative and not guidance.</text></g><rect x="0" y="479.0" width="392.0" height="36" fill="#F0E3F6" /><text x="12" y="503.0" fill="#8200B5" font-family="Arial" font-size="14" font-weight="700">Physician Written Order</text></g><g transform="translate(440.0 24.0)"><rect x="0" y="0" width="392.0" height="515.0" rx="3" fill="white" stroke="#D7D5DC" /><g transform="scale(0.56)"><text x="30" y="42" fill="#8200B5" font-family="Arial" font-size="18" font-weight="700">SYNTHETIC DOCUMENT / PORTFOLIO EXAMPLE</text><text x="30" y="92" fill="#35333B" font-family="Arial" font-size="30" font-weight="700">Sample clinical order</text><text x="30" y="136" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Patient: Patient A     Record: SAMPLE-001</text><text x="30" y="172" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Date of birth: 01/01/2000</text><text x="30" y="208" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Provider: Example Clinic     Order: SAMPLE-ORDER</text><text x="30" y="244" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Document purpose: illustrative review input</text><text x="30" y="280" fill="#35333B" font-family="Arial" font-size="19" font-weight="400" /><text x="30" y="316" fill="#35333B" font-family="Arial" font-size="19" font-weight="700">REVIEW DETAILS</text><text x="30" y="352" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Requested service: sample treatment</text><text x="30" y="388" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Supporting evidence: document section A</text><text x="30" y="424" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Document date: 01/01/2025</text><text x="30" y="460" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Reviewer checks: identity, source, required fields</text><text x="30" y="496" fill="#35333B" font-family="Arial" font-size="19" font-weight="400" /><text x="30" y="532" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">This example contains no original patient record.</text><text x="30" y="568" fill="#35333B" font-family="Arial" font-size="19" font-weight="400">Clinical content is illustrative and not guidance.</text></g><rect x="0" y="479.0" width="392.0" height="36" fill="#F0E3F6" /><text x="12" y="503.0" fill="#8200B5" font-family="Arial" font-size="14" font-weight="700">Physician Written Order</text></g></g><rect x="1418" y="0" width="606" height="1100" rx="0" fill="#F7F7F9" stroke="none" stroke-width="1" /><text x="1439" y="46" font-family="Arial" font-size="27" font-weight="700" fill="#202020">Tag Document Pages</text><g transform="translate(1980 25) scale(0.8333333333333334)"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#77776E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1439" y="103" font-family="Arial" font-size="21" font-weight="700" fill="#8200B5">Tagged Pages</text><text x="1583" y="103" font-family="Arial" font-size="17" font-weight="400" fill="#77776E">(optional)</text><text x="1439" y="134" font-family="Arial" font-size="18" font-weight="400" fill="#77776E">Select pages to assign tags and add notes.</text><path d="M1439 151L1439 202" fill="none" stroke="#DEDEE3" stroke-width="1" /><text x="1450" y="172" font-