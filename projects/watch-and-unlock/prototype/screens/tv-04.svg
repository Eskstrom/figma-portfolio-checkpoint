<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-label="Continue on your phone"><title>Continue on your phone</title><rect x="0" y="0" width="1920" height="1080" fill="#111111" rx="0"/><text x="96" y="105" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="600">streamly</text><text x="302" y="105" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">WATCH &amp; UNLOCK</text><rect x="1514" y="60" width="310" height="72" fill="#1D1D1D" rx="36" stroke="#555555" stroke-width="2"/><circle cx="1555" cy="96" r="17" fill="none" stroke="#B8B8B8" stroke-width="2"/><text x="1590" y="106" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">20 tokens</text><path d="M96 162h1728" stroke="#555555"/><text x="96" y="1015" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">STREAMLY  /  REWARDS PILOT</text><text x="1380" y="1015" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">Back = return   ·   Select = choose</text><text x="96" y="262" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="600">A quick detour. A small bonus.</text><text x="96" y="319" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">Watch the Northstar Audio demo on your phone to earn 5 tokens.</text><rect x="96" y="378" width="1728" height="554" fill="#1D1D1D" rx="24" stroke="#555555" stroke-width="2"/><rect x="144" y="426" width="400" height="400" fill="#EEEEEE" rx="16"/><text x="184" y="596" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600">QR CODE</text><text x="184" y="642" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="400">PLACEHOLDER</text><text x="184" y="700" fill="#444444" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">Prototype only · not scannable</text><text x="640" y="461" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">1. Scan with your phone</text><text x="640" y="529" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">2. Confirm your Streamly account</text><text x="640" y="597" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">3. Watch the 10-second demo</text><text x="640" y="675" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="400">Or visit streamly.example/reward · Code DEMO25</text><text x="640" y="715" fill="#B8B8B8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">Fictional address and code for this wireframe.</text><rect x="640" y="756" width="388" height="44" fill="#292929" rx="22.0" stroke="#555555" stroke-width="2"/><text x="656" y="785.0" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">WAITING FOR YOUR PHONE</text><g data-action="tv-03" role="button" tabindex="0" aria-label="Back to TV"><title>Back to TV</title><rect x="1416" y="812" width="360" height="76" fill="#1D1D1D" rx="12" stroke="#555555" stroke-width="2"/><text x="1436" y="859.1" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">Back to TV</text></g></svg>